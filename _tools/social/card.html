<!doctype html>
<html><head>
<!-- Source for assets/joe-ferber-social.png. Render with: Chrome --headless=new --window-size=1200,630 --screenshot --><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#fff;font-family:Inter,system-ui,sans-serif;color:#0a2540;-webkit-font-smoothing:antialiased}
.ribbon{position:absolute;inset:-40% -12% auto 34%;height:150%;transform:skewY(-12deg);transform-origin:0 0;overflow:hidden}
.ribbon::before{content:"";position:absolute;inset:-20%;background:
 radial-gradient(ellipse 38% 46% at 86% 26%,rgba(254,150,21,.9),transparent 70%),
 radial-gradient(ellipse 40% 44% at 64% 30%,rgba(244,75,204,.78),transparent 70%),
 radial-gradient(ellipse 34% 40% at 80% 58%,rgba(253,133,150,.7),transparent 70%),
 radial-gradient(ellipse 46% 50% at 52% 62%,rgba(99,91,255,.72),transparent 70%),
 radial-gradient(ellipse 40% 42% at 34% 50%,rgba(128,202,255,.6),transparent 70%),
 radial-gradient(ellipse 50% 40% at 30% 82%,rgba(226,228,255,.9),transparent 70%)}
.ribbon::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff)}
.guides{position:absolute;inset:0 72px;display:grid;grid-template-columns:repeat(4,1fr)}
.guides span{border-left:1px dashed rgba(10,37,64,.08)}.guides span:last-child{border-right:1px dashed rgba(10,37,64,.08)}
.txt{position:absolute;left:72px;top:64px;width:640px}
.mark{font-weight:600;font-size:24px;letter-spacing:-.01em}
h1{margin:118px 0 0;font-weight:400;font-size:76px;line-height:1.04;letter-spacing:-.035em;color:#061b31}
h1 span{color:#5b6f93}
p{margin:26px 0 0;font-size:24px;line-height:1.45;color:#425466;max-width:24em}
.url{position:absolute;left:72px;bottom:56px;font:500 20px "Source Code Pro",monospace;color:#533afd}
.portrait{position:absolute;right:96px;top:84px;width:330px;transform:perspective(1200px) rotateY(-9deg) rotateX(3deg)}
.photo{border-radius:14px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 40px 70px -18px rgba(50,50,93,.35),0 24px 40px -24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.7)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.cap{position:absolute;left:-44px;bottom:30px;background:#fff;border:1px solid #e6ecf2;border-radius:10px;box-shadow:0 13px 27px -5px rgba(50,50,93,.2),0 8px 16px -8px rgba(0,0,0,.15);padding:13px 18px;font-size:15px;line-height:1.45;color:#425466}
.cap b{display:block;font-weight:500;font-size:17px;color:#061b31}
</style></head><body>
<div class="ribbon"></div>
<div class="guides"><span></span><span></span><span></span><span></span></div>
<div class="txt"><div class="mark">Joe Ferber</div><h1>Complex systems, <span>made useful.</span></h1><p>I work on operations problems that need a business case and working software.</p></div>
<div class="url">joeferber.com</div>
<div class="portrait"><div class="photo"><img src="../../assets/joe-ferber-portrait.jpg"></div><div class="cap"><b>Joe Ferber</b>MBAi candidate, Kellogg and McCormick<br>Previously at Orbus and Epic</div></div>
</body></html>
