<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Prize Inside</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Tahoma, Verdana, sans-serif; }
  body { background: #008080; cursor: pointer; }
  #start {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: #fff;
  }
  #start h1 { font-size: clamp(28px, 6vw, 64px); margin: 0 0 12px; text-shadow: 3px 3px 0 #000; }
  #start p { font-size: 20px; margin: 0; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .win {
    position: fixed; width: 300px; background: #c0c0c0; border: 2px solid;
    border-color: #fff #404040 #404040 #fff; box-shadow: 2px 2px 0 #000;
    animation: pop .15s ease-out;
  }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .bar {
    background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: bold;
    font-size: 13px; padding: 3px 4px 3px 6px; display: flex; justify-content: space-between; align-items: center;
  }
  .bar button {
    width: 18px; height: 16px; padding: 0; font-size: 11px; line-height: 1; font-weight: bold;
    background: #c0c0c0; border: 2px solid; border-color: #fff #404040 #404040 #fff; cursor: pointer;
  }
  .body { padding: 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .body .icon { font-size: 32px; line-height: 1; }
  .body b { color: #c00; }
  .btns { display: flex; justify-content: center; gap: 8px; padding: 0 12px 12px; }
  .btns button {
    min-width: 72px; padding: 4px 8px; font: inherit; font-size: 13px; background: #c0c0c0;
    border: 2px solid; border-color: #fff #404040 #404040 #fff; cursor: pointer;
  }

  .face {
    position: fixed; border-radius: 50%; pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    animation: facepop .4s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  @keyframes facepop { from { transform: scale(0) rotate(-180deg); } }
  .face.spin { animation: facepop .4s cubic-bezier(.2, 1.6, .4, 1) both, spin 2s linear .4s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  body.shake { animation: shake .3s infinite; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); } 25% { transform: translate(-4px,3px); }
    50% { transform: translate(4px,-3px); } 75% { transform: translate(-3px,-4px); }
  }
</style>
</head>
<body>
<div id="start">
  <div>
    <h1>🎁 YOU'VE WON! 🎁</h1>
    <p>Click anywhere to claim your prize</p>
  </div>
</div>

<script>
const FACE = 'face.jpg';

const scams = [
  { t: 'Congratulations!!!', i: '🏆', m: 'You are the <b>1,000,000th</b> visitor! Claim your FREE iPad now!', b: ['CLAIM', 'Also claim'] },
  { t: 'VIRUS DETECTED', i: '⚠️', m: 'Your computer has <b>47 viruses</b>. One of them is this guy.', b: ['Remove', 'Keep him'] },
  { t: 'Nigerian Prince', i: '👑', m: 'Dearest friend, I require <b>$1 and a selfie</b> to release $40 million.', b: ['Send', 'Send twice'] },
  { t: 'Hot Singles', i: '💘', m: '<b>3 hot singles</b> in your area want to meet you. All of them are him.', b: ['Meet', 'Meet anyway'] },
  { t: 'Warning', i: '🛑', m: 'Your RAM is <b>98% full</b>. Download more RAM?', b: ['Download', 'OK'] },
  { t: 'IRS Notice', i: '📄', m: 'You owe <b>$3.50</b> in back taxes. Pay in iTunes gift cards immediately.', b: ['Pay', 'Pay faster'] },
  { t: 'Car Warranty', i: '🚗', m: "We've been trying to reach you about your car's <b>extended warranty</b>.", b: ['Answer', 'Ignore (fails)'] },
  { t: 'Free Money', i: '💸', m: 'Doctors <b>HATE</b> this one weird trick. He knows it.', b: ['Learn', 'Learn more'] },
  { t: 'System Alert', i: '🖥️', m: 'Windows has detected that you are <b>not smiling enough</b>.', b: ['Smile', 'OK'] },
  { t: 'Crypto Opportunity', i: '🪙', m: 'Invest in <b>$FACECOIN</b>. 10,000% returns. Guaranteed by this guy.', b: ['Invest', 'Go all in'] },
  { t: 'Error', i: '❌', m: 'Task failed successfully.', b: ['OK', 'Also OK'] },
  { t: 'Security Center', i: '🔒', m: 'Someone is <b>looking at you</b> through your screen. It is him.', b: ['I know', 'Help'] },
];

const rand = (a, b) => Math.random() * (b - a) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
let z = 10, started = false, count = 0;

function spawnPopup(x, y) {
  const s = pick(scams);
  const w = document.createElement('div');
  w.className = 'win';
  w.style.zIndex = ++z;
  const W = Math.min(300, innerWidth - 20);
  w.style.width = W + 'px';
  w.style.left = (x ?? rand(0, innerWidth - W)) + 'px';
  w.style.top = (y ?? rand(0, innerHeight - 170)) + 'px';
  w.innerHTML = `
    <div class="bar"><span>${s.t}</span><button aria-label="Close">×</button></div>
    <div class="body"><span class="icon">${s.i}</span><span>${s.m}</span></div>
    <div class="btns">${s.b.map(b => `<button>${b}</button>`).join('')}</div>`;
  // Every button just spawns more. Closing one opens two.
  w.querySelectorAll('button').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    w.remove();
    burst(2, 2);
  }));
  document.body.appendChild(w);
}

function spawnFace() {
  const img = document.createElement('img');
  img.src = FACE;
  img.alt = '';
  img.className = 'face' + (Math.random() < .3 ? ' spin' : '');
  const size = rand(80, 260);
  img.style.width = img.style.height = size + 'px';
  img.style.left = rand(-size / 3, innerWidth - size * 2 / 3) + 'px';
  img.style.top = rand(-size / 3, innerHeight - size * 2 / 3) + 'px';
  img.style.zIndex = ++z;
  img.style.rotate = rand(-25, 25) + 'deg';
  document.body.appendChild(img);
}

function burst(popups, faces) {
  for (let i = 0; i < popups; i++) setTimeout(spawnPopup, i * 120);
  for (let i = 0; i < faces; i++) setTimeout(spawnFace, i * 90);
}

function cleanup() {
  // Keep the page from grinding to a halt.
  const all = document.querySelectorAll('.win, .face');
  for (let i = 0; i < all.length - 150; i++) all[i].remove();
}

document.addEventListener('click', e => {
  if (!started) {
    started = true;
    document.getElementById('start').remove();
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 1500);
    burst(6, 10);
    // Keep the chaos going on its own.
    setInterval(() => {
      count++;
      burst(1, 2);
      cleanup();
    }, 600);
    return;
  }
  spawnPopup(Math.min(e.clientX, innerWidth - 300), Math.min(e.clientY, innerHeight - 170));
  burst(0, 3);
});
</script>
</body>
</html>
