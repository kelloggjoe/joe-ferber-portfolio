<!doctype html>
<!-- Set data-feed to the proxy URL in _cta-proxy/ to switch from the sample run to live CTA positions. -->
<!-- Cloudflare lets browsers keep CSS and JS for hours, so every asset URL
     carries ?v=. Bump it (here, in the import map, and on the links below)
     whenever trains/ changes. -->
<html lang="en" data-feed="" data-version="7">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chicago ’L’ Tracker | Joe Ferber</title>
  <meta name="description" content="Every CTA ’L’ train on an 8-bit map of Chicago.">
  <meta name="theme-color" content="#121a2e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chicago ’L’ Tracker">
  <meta property="og:description" content="Every CTA ’L’ train on an 8-bit map of Chicago.">
  <meta property="og:url" content="https://joeferber.com/trains/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/assets/favicon.svg?v=1" type="image/svg+xml">
  <link rel="preload" href="fonts/jersey-10-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/network.json?v=7" as="fetch" crossorigin>
  <link rel="stylesheet" href="styles.css?v=7">
  <script type="importmap">
    {
      "imports": {
        "./lib/route.js": "./lib/route.js?v=7",
        "./lib/sim.js": "./lib/sim.js?v=7",
        "./lib/cta.js": "./lib/cta.js?v=7",
        "./lib/eggs.js": "./lib/eggs.js?v=7",
        "./lib/places.js": "./lib/places.js?v=7",
        "./lib/sky.js": "./lib/sky.js?v=7",
        "./lib/favorites.js": "./lib/favorites.js?v=7"
      }
    }
  </script>
  <script type="module" src="app.js?v=7"></script>
</head>
<body>
  <canvas id="map" tabindex="0" role="img" aria-label="Map of Chicago’s ’L’ lines with a dot for each train"></canvas>

  <header class="hud panel">
    <div class="hud-top">
      <h1>Chicago ’L’</h1>
      <a class="home" href="/">joeferber.com</a>
    </div>
    <p class="status">
      <span class="mode" id="mode">Sample run</span>
      <span id="count">Loading trains</span>
      <time id="clock"></time>
    </p>
    <p class="note" id="note">Simulated trains running the real routes and stops. Live CTA positions are coming soon.</p>
    <section class="board">
      <button type="button" class="board-toggle" id="board-toggle" aria-expanded="false" aria-controls="board-body">
        <span>Next trains</span>
        <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 2h7v1H6v1H5v1H4v1H3V5H2V4H1V3H0z"/></svg>
      </button>
      <div class="board-body" id="board-body" hidden>
        <div class="board-favs" id="board-favs" hidden>
          <span>Your stops</span>
          <div class="fav-list" id="fav-list"></div>
        </div>
        <div class="board-pick">
          <label>Line<select id="pick-line"></select></label>
          <label>Station<select id="pick-station"></select></label>
        </div>
        <button type="button" class="fav-toggle" id="fav-toggle" aria-pressed="false">
          <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M3 0h1v2h3v1H6v1H5v1h1v2H5V6H2v1H1V5h1V4H1V3H0V2h3z"/></svg>
          <span id="fav-toggle-label">Save this stop</span>
        </button>
        <ol class="arrivals" id="arrivals"></ol>
        <p class="board-note" id="board-note" aria-live="polite"></p>
      </div>
    </section>
  </header>

  <nav class="legend panel" aria-label="Show or hide lines" id="legend"></nav>

  <div class="zoom panel" role="group" aria-label="Map zoom">
    <button type="button" data-zoom="in" aria-label="Zoom in">
      <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M3 0h1v3h3v1H4v3H3V4H0V3h3z"/></svg>
    </button>
    <button type="button" data-zoom="out" aria-label="Zoom out">
      <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 3h7v1H0z"/></svg>
    </button>
    <button type="button" data-zoom="fit" aria-label="Show the whole system">
      <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 0h3v1H1v2H0zM4 0h3v3H6V1H4zM0 4h1v2h2v1H0zM6 4h1v3H4V6h2z"/></svg>
    </button>
  </div>

  <aside class="card panel" id="card" aria-live="polite" hidden>
    <button type="button" class="card-close" id="card-close" aria-label="Close train details">
      <svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 0h1v1h1v1h1v1h1V2h1V1h1V0h1v1H6v1H5v1H4v1h1v1h1v1h1v1H6V6H5V5H4V4H3v1H2v1H1v1H0V6h1V5h1V4h1V3H2V2H1V1H0z"/></svg>
    </button>
    <p class="card-line"><i id="card-swatch"></i><span id="card-title"></span></p>
    <dl>
      <dt>To</dt><dd id="card-dest"></dd>
      <dt>Next</dt><dd id="card-next"></dd>
    </dl>
    <p class="card-flag" id="card-flag" hidden></p>
  </aside>

  <div class="tip" id="tip" hidden></div>
</body>
</html>
